name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Deliberately no global `RUSTFLAGS: -D warnings`: that applies to
  # dependencies too, so an upstream crate emitting a warning would fail
  # our build. The clippy step below denies warnings for our own code,
  # which is where the policy belongs.

jobs:
  # Formatting, lints, and the strict-subset check run once. They are
  # platform-independent, so repeating them per OS would only cost time.
  check:
    name: Format, clippy, and strictrs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      # strictrs publishes no lockfile, so this resolves fresh. If an
      # upstream break ever makes that flaky, pin --rev here.
      - name: Install strictrs
        run: cargo install --git https://github.com/ilvar/strictrs

      - name: strictrs check
        run: strictrs check .

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `age` is needed by the crypto and seal tests. Those tests skip
      # themselves when it is absent, so installing it here is what makes
      # the encryption path actually covered rather than silently skipped.
      - name: Install age (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Install age (macOS)
        if: runner.os == 'macOS'
        run: brew install age

      - name: Install age (Windows)
        if: runner.os == 'Windows'
        run: choco install age.portable -y

      - name: Confirm age is on PATH
        shell: bash
        run: age --version && age-keygen --version || true

      - name: cargo test
        run: cargo test --all-targets --all-features

  build:
    name: Build ${{ matrix.target }}
    needs: [check, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux ships static MUSL binaries so they run on any
          # distribution without a glibc version to match.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: legacy
            # musl-tools provides a genuine musl compiler for the host
            # architecture, which is all this target needs.
            musl_tools: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            binary: legacy
            # Built through `cross`, which supplies a real aarch64 *musl*
            # toolchain in a container. See the comment on that step: the
            # obvious-looking apt route silently mixes two libcs.
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            binary: legacy
          - os: macos-latest
            target: aarch64-apple-darwin
            binary: legacy
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: legacy.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # rusqlite bundles SQLite, so every Linux build compiles C as well as
      # Rust, and the C compiler's libc must match the one being linked.
      - name: Install musl tooling
        if: matrix.musl_tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # `cross` runs the build in an image with a real aarch64-musl
      # toolchain. Do not be tempted to replace this with
      # gcc-aarch64-linux-gnu: that is a *glibc* cross-compiler, so SQLite
      # gets built against glibc headers (open -> open64, memcpy ->
      # __memcpy_chk, stat -> stat64) and then fails to link against musl,
      # which has none of those symbols.
      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross --locked

      - name: Build release binary
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: cross build --release --locked --target ${{ matrix.target }}

      # A binary that cannot print its own help is not a working build.
      - name: Smoke-test the binary
        if: ${{ !matrix.use_cross }}
        shell: bash
        run: |
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} --help
          ./target/${{ matrix.target }}/release/${{ matrix.binary }} interview banks

      # The host cannot execute a foreign-architecture binary, so check its
      # shape instead: it must actually be a static ARM64 executable, which
      # is what the earlier glibc/musl mismatch would have got wrong.
      - name: Inspect the cross-compiled binary
        if: matrix.use_cross
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          file "$BIN"
          file "$BIN" | grep -q "ARM aarch64"
          file "$BIN" | grep -q "statically linked"
          # A dynamic dependency here would mean musl did not get linked in.
          if ldd "$BIN" 2>&1 | grep -q "=>"; then
            echo "expected a static binary, but it has dynamic dependencies" >&2
            exit 1
          fi

      - name: Report binary size
        shell: bash
        run: ls -l "target/${{ matrix.target }}/release/${{ matrix.binary }}"

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          if-no-files-found: error

  # An archive is only as good as its recovery path, so CI exercises the
  # whole lifecycle end to end rather than trusting the unit tests alone.
  round-trip:
    name: Seal and unseal round trip
    needs: [check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Install age and par2
        run: sudo apt-get update && sudo apt-get install -y age par2

      - name: Build
        run: cargo build --release --locked

      - name: Create, seal, and recover an archive
        shell: bash
        run: |
          set -euo pipefail
          LEGACY="$PWD/target/release/legacy"
          WORK="$(mktemp -d)"
          cd "$WORK"

          "$LEGACY" init ./arch --subject "CI Subject" --threshold 2 --shares 3
          "$LEGACY" story add -a ./arch --title "A family story" --date 1994-09-15 \
            --visibility family --body "The secret phrase is xyzzy."
          "$LEGACY" story add -a ./arch --title "A public fact" --date 1990 \
            --visibility public --body "Anyone may read this."
          "$LEGACY" timeline build -a ./arch
          "$LEGACY" verify -a ./arch

          "$LEGACY" seal -a ./arch --tiers family | tee seal.txt

          # par2 recovery data must exist, since par2 is installed here.
          test -f arch/sealed/family.tar.age
          ls arch/sealed/*.par2 >/dev/null

          # The plaintext archive must survive sealing untouched.
          test -f arch/timeline/1994/1994-09-15-a-family-story.md

          # Public stories are never encrypted.
          grep -q "Anyone may read this." arch/timeline/1990/1990-a-public-fact.md

          # Recover with exactly the threshold number of shares.
          S1="$(sed -n 's/.*share 1: //p' seal.txt | head -1)"
          S2="$(sed -n 's/.*share 2: //p' seal.txt | head -1)"
          "$LEGACY" unseal -a ./arch --share "$S1" --share "$S2"
          grep -rq "The secret phrase is xyzzy." arch/unsealed/family/

          # The bundled bash verifier must work on its own.
          (cd arch && ./verify-archive.sh)

          echo "Round trip complete."

      - name: Confirm the archive is recoverable without the binary
        shell: bash
        run: |
          set -euo pipefail
          # README.txt must carry everything a future reader needs: the
          # standard, the encoding, and the key hash to check against.
          WORK="$(mktemp -d)" && cd "$WORK"
          "$GITHUB_WORKSPACE/target/release/legacy" init ./arch --subject "CI Subject"
          grep -q "slip-0039.md" arch/README.txt
          grep -q "bip-0173" arch/README.txt
          grep -q "age -d -i" arch/README.txt
          grep -q "sha256sum -c MANIFEST.sha256" arch/README.txt
          echo "README.txt documents the full recovery path."
