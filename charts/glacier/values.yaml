replicaCount: 1

image:
  repository: ghcr.io/ilvar/glacier
  pullPolicy: IfNotPresent
  # Empty means use Chart.appVersion. Release packages set appVersion from
  # the matching Cargo.toml/git-tag version; the source chart uses latest.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8000

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  annotations: {}

env: []
envFrom: []
resources: {}
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: glacier.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
