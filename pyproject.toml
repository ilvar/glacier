[project]
name = "legacy"
version = "0.1.0"
description = "A self-hosted life-story vault and digital replica"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "shamir-mnemonic>=0.3.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
legacy = "legacy.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer's `= typer.Option(...)` default-argument pattern is idiomatic, not a bug.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
